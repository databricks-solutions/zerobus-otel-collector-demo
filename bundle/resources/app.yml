resources:
  apps:
    otel_observability:
      name: ${var.app_name}
      description: Kubernetes telemetry dashboards & assistant.
      source_code_path: ${workspace.file_path}/app
      lifecycle:
        started: true
      # On-behalf-of-user (OBO) authorization scopes. These let the app forward the
      # signed-in user's own downscoped token (via the x-forwarded-access-token
      # header) to the SQL Statement Execution API and the Genie Conversation API,
      # so data access is governed by the viewing user's own UC grants instead of
      # the app's service principal.
      user_api_scopes:
        - sql
        - dashboards.genie
      config:
        command: ['uvicorn', 'app:app', '--host', '0.0.0.0', '--port', '8000']
        env:
          - name: 'DATABRICKS_WAREHOUSE_ID'
            value: ${resources.sql_warehouses.warehouse.id}
          - name: 'GENIE_SPACE_ID'
            value: ${var.genie_space_id}
          - name: 'OTEL_CATALOG'
            value: ${resources.schemas.dest_schema.catalog_name}
          - name: 'OTEL_SCHEMA'
            value: ${resources.schemas.dest_schema.name}
