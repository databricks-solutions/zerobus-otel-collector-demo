# This is a Databricks asset bundle definition for zerobus_otel_k8s_example.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: zerobus_otel_k8s_example
  uuid: 95af4ec2-6b98-4f25-9bd7-46c73e30a633

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  source_catalog:
    description: Catalog containing the bronze OTEL tables
  source_schema:
    description: Schema containing the bronze OTEL tables
    default: otel_bronze
  dest_catalog:
    description: Catalog for silver pipeline output tables
  dest_schema:
    description: Schema for silver pipeline output tables
    default: kubernetes_otel_silver
  table_prefix:
    default: kubernetes
    description: Prefix used for OTEL bronze tables (e.g. kubernetes_otel_logs)

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    variables:
      source_catalog: default
      dest_catalog: default
      table_prefix: kubernetes
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/${bundle.name}
    variables:
      source_catalog: default
      dest_catalog: default
      table_prefix: kubernetes
