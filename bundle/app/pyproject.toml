[project]
name = "otel-observability-app"
version = "0.1.0"
description = "Databricks App for OpenTelemetry observability — dashboard + embedded Genie chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "databricks-sdk>=0.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[[tool.uv.index]]
name = "databricks-internal"
url = "https://pypi-proxy.dev.databricks.com/simple/"
default = true
