mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

presets:
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
  logsCollection:
    enabled: false
  annotationDiscovery:
    metrics:
      enabled: true

service:
  enabled: true

# Databricks SP credentials are mounted from a Kubernetes Secret.
# The default secret name is "databricks-sp"; override per deployment if needed.
# NOTE: when deployed via Terraform, this entire block is replaced by the
# extraEnvs list assembled in helm_releases.tf. The values below are
# illustrative — edit them there, not here.
extraEnvs:
  - name: DATABRICKS_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: databricks-sp
        key: client_id
  - name: DATABRICKS_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: databricks-sp
        key: client_secret
  - name: WORKSPACE_URL
    value: https://workspace.cloud.databricks.com
  - name: ZEROBUS_ENDPOINT
    value: 0.zerobus.us-west-2.cloud.databricks.com:443
  - name: ZEROBUS_RESOURCE
    value: api://databricks/workspaces/0/zerobusDirectWriteApi

# Three named oauth2client extensions, one per signal, each scoped to a single
# Unity Catalog table via endpoint_params.authorization_details. Token URL,
# resource, and authorization_details must be set per deployment.
config:
  extensions:
    oauth2client/spans:
      client_id: ${env:DATABRICKS_CLIENT_ID}
      client_secret: ${env:DATABRICKS_CLIENT_SECRET}
      token_url: ${env:WORKSPACE_URL}/oidc/v1/token
      scopes: ['all-apis']
      endpoint_params:
        resource: ${env:ZEROBUS_RESOURCE}
        authorization_details:
          - '[]'
    oauth2client/logs:
      client_id: ${env:DATABRICKS_CLIENT_ID}
      client_secret: ${env:DATABRICKS_CLIENT_SECRET}
      token_url: ${env:WORKSPACE_URL}/oidc/v1/token
      scopes: ['all-apis']
      endpoint_params:
        resource: ${env:ZEROBUS_RESOURCE}
        authorization_details:
          - '[]'
    oauth2client/metrics:
      client_id: ${env:DATABRICKS_CLIENT_ID}
      client_secret: ${env:DATABRICKS_CLIENT_SECRET}
      token_url: ${env:WORKSPACE_URL}/oidc/v1/token
      scopes: ['all-apis']
      endpoint_params:
        resource: ${env:ZEROBUS_RESOURCE}
        authorization_details:
          - '[]'

  # Note that when using Terraform, the real endpoint values will be provided by the helm provider
  exporters:
    otlp/databricks-spans:
      endpoint: ${env:ZEROBUS_ENDPOINT}
      auth:
        authenticator: oauth2client/spans
      headers:
        x-databricks-zerobus-table-name: catalog.schema.table_otel_spans
    otlp/databricks-logs:
      endpoint: ${env:ZEROBUS_ENDPOINT}
      auth:
        authenticator: oauth2client/logs
      headers:
        x-databricks-zerobus-table-name: catalog.schema.table_otel_logs
    otlp/databricks-metrics:
      endpoint: ${env:ZEROBUS_ENDPOINT}
      auth:
        authenticator: oauth2client/metrics
      headers:
        x-databricks-zerobus-table-name: catalog.schema.table_otel_metrics

  service:
    extensions:
      - health_check
      - oauth2client/spans
      - oauth2client/logs
      - oauth2client/metrics
    pipelines:
      logs:
        exporters:
          - otlp/databricks-logs
      metrics:
        exporters:
          - otlp/databricks-metrics
      traces:
        exporters:
          - otlp/databricks-spans
