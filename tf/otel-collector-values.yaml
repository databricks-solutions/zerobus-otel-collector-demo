mode: daemonset

image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

#command:
#  name: "otelcol-k8s"

presets:
  hostMetrics:
    enabled: true
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: true
  clusterMetrics:
    enabled: true
  kubernetesEvents:
    enabled: true
  logsCollection:
    enabled: false
  annotationDiscovery:
    metrics:
      enabled: true

service:
  enabled: true

