  exporters:
    otlphttp/databricks-logs:
      auth:
        authenticator: oauth2client
    otlphttp/databricks-metrics:
      auth:
        authenticator: oauth2client
    otlphttp/databricks-spans:
      auth:
        authenticator: oauth2client

  service:
    extensions:
      - health_check
      - oauth2client
